# Todo dia às 8h de Brasília, coleta os mais vendidos da Shopee e atualiza
# dados/tendencias.json, que os painéis "Em alta" da aba Caçar ofertas leem.
name: Coletar tendências

on:
  schedule:
    - cron: "0 11 * * *"  # 11h UTC = 8h em Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar e calcular tendências
        run: python scripts/coletar_tendencias.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || git commit -m "Tendências de $(TZ=America/Sao_Paulo date +%F)"
          git push
